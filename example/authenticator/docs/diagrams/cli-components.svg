<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1110" viewBox="0 0 1440 1110" role="img" aria-labelledby="title desc">
<title id="title">C4 component diagram — Cangjie CLI</title><desc id="desc">One CLI process; independent in-memory session. Boxes identify C4 components and their technologies; arrows identify calls or data relationships through named ports. The green component is the proved CJR core.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#526276"/></marker></defs>
<style>text{font-family:system-ui,sans-serif;fill:#203044} .type{font-size:12px;fill:#586778} .name{font-size:18px;font-weight:700} .tech{font-size:12px;fill:#42716c} .detail{font-size:13px} .edge{font-size:12px;paint-order:stroke;stroke:#f3f5f7;stroke-width:5px;stroke-linejoin:round} .protocol{font-size:11px;font-style:italic}</style>
<rect width="1440" height="1110" fill="#f3f5f7"/>
<text x="24" y="35" font-size="25" font-weight="700">C4 component diagram — Cangjie CLI</text>
<text x="24" y="65" font-size="15">One CLI process; independent in-memory session</text>
<rect x="190" y="100" width="1225" height="865" rx="8" fill="none" stroke="#586778" stroke-dasharray="8 5"/>
<text x="215" y="125" font-size="14">[Container: native application process]</text>
<path d="M170 240 H235" fill="none" stroke="#526276" stroke-width="1.7" marker-end="url(#arrow)"/>
<text class="edge" x="202" y="150" text-anchor="middle">Enters commands / reads output</text><text class="edge protocol" x="202" y="167" text-anchor="middle">stdin / stdout</text>
<path d="M525 240 H920" fill="none" stroke="#526276" stroke-width="1.7" marker-end="url(#arrow)"/>
<text class="edge" x="720" y="210" text-anchor="middle">Calls AccountPort</text><text class="edge protocol" x="720" y="227" text-anchor="middle">Cangjie interface</text>
<path d="M380 320 V450" fill="none" stroke="#526276" stroke-width="1.7" marker-end="url(#arrow)"/>
<text class="edge" x="380" y="385" text-anchor="middle">Normalizes enrollment</text><text class="edge protocol" x="380" y="402" text-anchor="middle">Cangjie call</text>
<path d="M235 520 H200 V350 H300 V320" fill="none" stroke="#526276" stroke-width="1.7" marker-end="url(#arrow)"/>
<text class="edge" x="235" y="365" text-anchor="middle">Returns normalized Enrollment</text><text class="edge protocol" x="235" y="382" text-anchor="middle">Cangjie value</text>
<path d="M525 285 H600 V660 H380 V720" fill="none" stroke="#526276" stroke-width="1.7" marker-end="url(#arrow)"/>
<text class="edge" x="675" y="635" text-anchor="middle">Requests current timestamp</text><text class="edge protocol" x="675" y="652" text-anchor="middle">ClockPort.now()</text>
<path d="M235 790 H170" fill="none" stroke="#526276" stroke-width="1.7" marker-end="url(#arrow)"/>
<text class="edge" x="200" y="700" text-anchor="middle">Reads wall clock</text><text class="edge protocol" x="200" y="717" text-anchor="middle">DateTime.nowUTC()</text>
<path d="M1100 320 V450" fill="none" stroke="#526276" stroke-width="1.7" marker-end="url(#arrow)"/>
<text class="edge" x="1100" y="380" text-anchor="middle">Invokes application port; owns lifetime</text><text class="edge protocol" x="1100" y="397" text-anchor="middle">direct Cangjie calls</text>
<path d="M1100 610 V740" fill="none" stroke="#526276" stroke-width="1.7" marker-end="url(#arrow)"/>
<text class="edge" x="1100" y="670" text-anchor="middle">Allocates, clears and frees buffers</text><text class="edge protocol" x="1100" y="687" text-anchor="middle">CJR primitives → runtime</text>
<rect x="20" y="180" width="150" height="120" rx="5" fill="#e6eaf0" stroke="#9eb0c2" stroke-width="2"/>
<text class="type" x="95.0" y="200" text-anchor="middle">[Person]</text>
<text class="name" x="95.0" y="224" text-anchor="middle">CLI user</text>
<text class="detail" x="95.0" y="250" text-anchor="middle">Enters commands; reads</text>
<text class="detail" x="95.0" y="267" text-anchor="middle">codes</text>
<rect x="20" y="720" width="150" height="120" rx="5" fill="#e6eaf0" stroke="#9eb0c2" stroke-width="2"/>
<text class="type" x="95.0" y="740" text-anchor="middle">[Software System]</text>
<text class="name" x="95.0" y="764" text-anchor="middle">OS clock</text>
<text class="tech" x="95.0" y="786" text-anchor="middle">Operating system</text>
<text class="detail" x="95.0" y="810" text-anchor="middle">Supplies Unix time</text>
<rect x="235" y="180" width="290" height="140" rx="5" fill="#ffffff" stroke="#9eb0c2" stroke-width="2"/>
<text class="type" x="380.0" y="200" text-anchor="middle">[Component]</text>
<text class="name" x="380.0" y="224" text-anchor="middle">Command loop / terminal</text>
<text class="tech" x="380.0" y="246" text-anchor="middle">Cangjie · main.cj</text>
<text class="detail" x="380.0" y="270" text-anchor="middle">Driving adapter; prompts, help,</text>
<text class="detail" x="380.0" y="287" text-anchor="middle">commands and output formatting</text>
<rect x="235" y="450" width="290" height="140" rx="5" fill="#ffffff" stroke="#9eb0c2" stroke-width="2"/>
<text class="type" x="380.0" y="470" text-anchor="middle">[Component]</text>
<text class="name" x="380.0" y="494" text-anchor="middle">Enrollment adapter</text>
<text class="tech" x="380.0" y="516" text-anchor="middle">Cangjie · enrollment.cj</text>
<text class="detail" x="380.0" y="540" text-anchor="middle">Parses URI/text into Enrollment;</text>
<text class="detail" x="380.0" y="557" text-anchor="middle">does not decode secrets or calculate OTP</text>
<rect x="235" y="720" width="290" height="140" rx="5" fill="#ffffff" stroke="#9eb0c2" stroke-width="2"/>
<text class="type" x="380.0" y="740" text-anchor="middle">[Component]</text>
<text class="name" x="380.0" y="764" text-anchor="middle">SystemClock</text>
<text class="tech" x="380.0" y="786" text-anchor="middle">Cangjie · main.cj</text>
<text class="detail" x="380.0" y="810" text-anchor="middle">Implements ClockPort.now();</text>
<text class="detail" x="380.0" y="827" text-anchor="middle">reads UTC Unix seconds</text>
<rect x="920" y="180" width="360" height="140" rx="5" fill="#ffffff" stroke="#9eb0c2" stroke-width="2"/>
<text class="type" x="1100.0" y="200" text-anchor="middle">[Component]</text>
<text class="name" x="1100.0" y="224" text-anchor="middle">CoreAccounts + Words</text>
<text class="tech" x="1100.0" y="246" text-anchor="middle">Cangjie · ports.cj</text>
<text class="detail" x="1100.0" y="270" text-anchor="middle">Implements AccountPort; owns session</text>
<text class="detail" x="1100.0" y="287" text-anchor="middle">and temporary Int64 word buffers</text>
<rect x="920" y="450" width="360" height="160" rx="5" fill="#e2f3ef" stroke="#006a75" stroke-width="2"/>
<text class="type" x="1100.0" y="470" text-anchor="middle">[Component]</text>
<text class="name" x="1100.0" y="494" text-anchor="middle">Account application core</text>
<text class="tech" x="1100.0" y="516" text-anchor="middle">CJR → extracted Cangjie</text>
<text class="detail" x="1100.0" y="540" text-anchor="middle">Application port: authNew/Destroy,</text>
<text class="detail" x="1100.0" y="557" text-anchor="middle">Add/List/Read/Rename/Remove/Code,</text>
<text class="detail" x="1100.0" y="574" text-anchor="middle">Remaining; state + Base32 + OTP</text>
<rect x="920" y="740" width="360" height="140" rx="5" fill="#ffffff" stroke="#9eb0c2" stroke-width="2"/>
<text class="type" x="1100.0" y="760" text-anchor="middle">[Component]</text>
<text class="name" x="1100.0" y="784" text-anchor="middle">Primitive memory adapter</text>
<text class="tech" x="1100.0" y="806" text-anchor="middle">Cangjie runtime + C allocator</text>
<text class="detail" x="1100.0" y="830" text-anchor="middle">calloc/free; modeled load/store</text>
<text class="detail" x="1100.0" y="847" text-anchor="middle">Allocation success is assumed</text>
<text x="24" y="1000" font-size="15" font-weight="700">C4 notation / hexagonal architecture key</text>
<text x="24" y="1028" font-size="13">White: trusted frontend/runtime adapter · Green: proved core component · Grey: person or external software system.</text>
<text x="24" y="1052" font-size="13">Dashed boundary: one process/container. Solid arrow: directed call or data relationship; labels identify the port/protocol.</text>
<text x="24" y="1076" font-size="13">ClockPort and AccountPort are frontend abstractions. The extracted auth* functions form the core application port. No persistence or network service.</text>
</svg>
